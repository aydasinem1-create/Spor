name: Derle ve test et

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formakit:
    name: FormaKit testleri
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode sürümü
        run: |
          ls /Applications | grep -i xcode || true
          LATEST=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          echo "Seçilen: $LATEST"
          sudo xcode-select -s "$LATEST/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Testler
        run: swift test --package-path Packages/FormaKit 2>&1 | tee formakit-test.log
      - name: Kayıt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formakit-log
          path: formakit-test.log
