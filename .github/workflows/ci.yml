name: Derle ve test et

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  formakit:
    name: FormaKit testleri
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode seç
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$LATEST/Contents/Developer"
          mkdir -p ci-out
          { xcodebuild -version; swift --version; } | tee ci-out/versions.log
      - name: Testler
        run: swift test --package-path Packages/FormaKit 2>&1 | tee ci-out/formakit-test.log
      - name: Sonuçları yayınla
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ci-out
          echo "${{ github.sha }} ${{ job.status }}" > STATUS
          git init -q
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI ${{ github.run_id }} ${{ job.status }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci-results/formakit
